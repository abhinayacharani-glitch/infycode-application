services:
  # ── Frontend (React + Vite) ──────────────────────────────────────────────
  - type: web
    name: infycode-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend (Node / Express) ─────────────────────────────────────────────
  - type: web
    name: infycode-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
